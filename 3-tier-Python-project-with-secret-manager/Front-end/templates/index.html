<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS User Management</title>
    <!-- Bootstrap 5 CDN for quick, clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4 text-center">Accesing project page using HTTPS</h2>
    
    <div class="row">
        <!-- Form Section -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" id="formTitle">Add New Item</h5>
                </div>
                <div class="card-body">
                    <!-- Form now points to the Python /save route -->
                    <form action="/save" method="POST" id="itemForm">
                        <!-- Hidden input to store ID when editing -->
                        <input type="hidden" name="itemId" id="itemId">
                        
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" name="name" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Country</label>
                            <input type="text" class="form-control" name="country" id="country" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100" id="saveBtn">Save Record</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="cancelBtn" onclick="resetForm()">Cancel</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Country</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Jinja2 loop injects rows directly from Python -->
                            {% for item in items %}
                            <tr>
                                <td>{{ item.id }}</td>
                                <td>{{ item.name }}</td>
                                <td>{{ item.email }}</td>
                                <td>{{ item.country }}</td>
                                <td>
                                    <!-- Edit Button (Uses tiny JS function below to populate form) -->
                                    <button class="btn btn-sm btn-outline-primary" 
                                            onclick="editItem({{ item.id }}, '{{ item.name }}', '{{ item.email }}', '{{ item.country }}')">
                                        Edit
                                    </button>
                                    
                                    <!-- Delete Button (Wrapped in a form to trigger Python POST route) -->
                                    <form action="/delete/{{ item.id }}" method="POST" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this record?')">
                                            Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="5" class="text-center">No records found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // This JS is now ONLY used to populate the form fields when clicking "Edit"
    function editItem(id, name, email, country) {
        document.getElementById('itemId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('email').value = email;
        document.getElementById('country').value = country;
        
        document.getElementById('formTitle').innerText = "Edit Item";
        document.getElementById('saveBtn').innerText = "Update Record";
        document.getElementById('saveBtn').classList.replace('btn-success', 'btn-primary');
        document.getElementById('cancelBtn').classList.remove('d-none');
    }

    // Clears the form when clicking "Cancel"
    function resetForm() {
        document.getElementById('itemForm').reset();
        document.getElementById('itemId').value = '';
        
        document.getElementById('formTitle').innerText = "Add New Item";
        document.getElementById('saveBtn').innerText = "Save Record";
        document.getElementById('saveBtn').classList.replace('btn-primary', 'btn-success');
        document.getElementById('cancelBtn').classList.add('d-none');
    }
</script>

</body>
</html>
