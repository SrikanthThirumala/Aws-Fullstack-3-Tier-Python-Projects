<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cache-banner { padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; }
        .hit { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .miss { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-back { display: inline-block; padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; margin-top: 15px; }
        .btn-back:hover { background: #5a6268; }
    </style>
</head>
<body>

    <!-- Dynamic Cache Status Banner -->
    <div class="cache-banner 
        {% if 'HIT' in cache_source %}hit
        {% elif 'MISS' in cache_source %}miss
        {% else %}error{% endif %}">
        🌐 Status: {{ cache_source }}
    </div>

    {% if item %}
        <div class="card">
            <h2>User Details</h2>
            <p><strong>ID:</strong> {{ item.id }}</p>
            <p><strong>Name:</strong> {{ item.name }}</p>
            <p><strong>Email:</strong> {{ item.email }}</p>
            <p><strong>Country:</strong> {{ item.country }}</p>
            
            <!-- Back Button returning to main list -->
            <a href="/" class="btn-back">⬅️ Back to All Users</a>
        </div>
    {% else %}
        <div class="card">
            <h2>User Not Found</h2>
            <a href="/" class="btn-back">⬅️ Back to All Users</a>
        </div>
    {% endif %}

</body>
</html>
