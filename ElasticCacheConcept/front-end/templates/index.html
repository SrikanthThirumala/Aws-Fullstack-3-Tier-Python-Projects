<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Flask SSR App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        
        /* Dynamic Cache Status Banner */
        .cache-banner { padding: 15px; margin-bottom: 30px; border-radius: 5px; font-weight: bold; font-size: 1.1em; }
        .hit { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .miss { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .form-group { background: #f9f9f9; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        input { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button, .btn-link { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block;}
        
        /* Button Colors */
        .btn-submit { background: #007bff; color: white; }
        .btn-submit:hover { background: #0056b3; }
        
        .btn-edit { background: #ffc107; color: #212529; }
        .btn-edit:hover { background: #e0a800; }
        
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete:hover { background: #c82333; }

        /* Style for the clickable ID link */
        .id-link { font-weight: bold; color: #007bff; text-decoration: none; }
        .id-link:hover { text-decoration: underline; color: #0056b3; }
        
        .action-buttons { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <h1>Cloud Database Directory</h1>
    
    <!-- Dynamic Cache Status Banner -->
    <div class="cache-banner 
        {% if 'HIT' in cache_source %}hit
        {% elif 'MISS' in cache_source %}miss
        {% else %}error{% endif %}">
        🌐 Status: {{ cache_source }}
    </div>

    <!-- Data Entry Form -->
    <div class="form-group">
        <h3>Add New Record</h3>
        <form action="/add" method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="text" name="country" placeholder="Country" required>
            <button type="submit" class="btn-submit">Submit to Primary DB</button>
        </form>
    </div>

    <!-- Data Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Country</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>
                    <a href="/item/{{ item.id }}" class="id-link">#{{ item.id }}</a>
                </td>
                <td>{{ item.name }}</td>
                <td>{{ item.email }}</td>
                <td>{{ item.country }}</td>
                <td>
                    <div class="action-buttons">
                        <!-- Edit Button (GET request to the edit form) -->
                        <a href="/edit/{{ item.id }}" class="btn-link btn-edit">Edit</a>
                        
                        <!-- Delete Button (POST request to delete route) -->
                        <form action="/delete/{{ item.id }}" method="POST" style="margin:0;">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" style="text-align: center;">No records found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
